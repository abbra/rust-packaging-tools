name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pinned: bump together with the Fedora release the packaging targets use
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install dependencies
        run: dnf -y install --setopt=install_weak_deps=False git-core python3 python3-pytest python3-pyyaml python3-textual rust2rpm shellcheck
      - uses: actions/checkout@v4
      - name: Compile
        run: python3 -m py_compile fedora-rust-packaging/scripts/rust-deps
      - name: Shellcheck
        run: shellcheck install.sh tests/smoke.sh
      - name: Unit tests
        run: python3 -m pytest -v tests
      - name: install.sh round trip
        run: |
          ./install.sh --dest "$RUNNER_TEMP/skills" --bin "$RUNNER_TEMP/bin"
          test -f "$RUNNER_TEMP/skills/fedora-rust-packaging/SKILL.md"
          test -x "$RUNNER_TEMP/bin/rust-deps"
          "$RUNNER_TEMP/bin/rust-deps" --help >/dev/null
          ./install.sh --uninstall --dest "$RUNNER_TEMP/skills" --bin "$RUNNER_TEMP/bin"
          test ! -e "$RUNNER_TEMP/skills/fedora-rust-packaging"
          test ! -e "$RUNNER_TEMP/bin/rust-deps"

  smoke:
    name: smoke test (crates.io, Fedora mirrors)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: registry.fedoraproject.org/fedora:44
      # trial runs tests offline in a user namespace (unshare -rn), as mock does
      options: --privileged
    steps:
      - name: Install dependencies
        run: >-
          dnf -y install --setopt=install_weak_deps=False
          git-core python3 rust2rpm cargo2rpm cargo rust rpm-build rpmdevtools rpmlint
          redhat-rpm-config patch util-linux-core iproute
      - uses: actions/checkout@v4
      - name: rust-deps --help
        run: fedora-rust-packaging/scripts/rust-deps --help
      - name: Smoke test
        run: tests/smoke.sh
      - name: Keep the generated tree on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-work
          path: ${{ runner.temp }}/
